# CI — the check that would have caught this project's backstory.
#
# Twice now, ecosystem drift has broken a build nobody was building:
# `--features net` sat broken for two full cycles because nothing in CI ever
# compiled it, and the reason it broke at all was an uncommitted `Cargo.lock`
# silently re-resolving to whatever crates.io published that week (HC12).
#
# So this file enforces three things, and each one maps to a scar:
#   1. `--locked` everywhere        -> the lock is the build, not a suggestion
#   2. a `--features net` job       -> the path that was broken and unwatched
#   3. `-D warnings`                -> 0 warnings is a gate, not an aspiration
#
# Plus a scheduled `cargo update --dry-run` that REPORTS drift without
# applying it. The point is to learn that the ecosystem moved *before* it
# breaks a build, which is precisely the signal we did not have.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      audit_sha:
        description: Commit whose tree the new workflow definition must audit
        required: false
        type: string
      publish_evidence:
        description: Sign and persist provenance for each CI-runner receipt
        required: true
        default: false
        type: boolean
  schedule:
    # Mondays 06:00 UTC — the drift report, see the `drift` job.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning. `cargo check` does not do this by itself.
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # ---------------------------------------------------------------------------
  # The offline path: everything except live fetching. MSRV floor is 1.78.
  # ---------------------------------------------------------------------------
  core:
    name: core (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.audit_sha || github.sha }}

      # rust-toolchain.toml pins the channel; this action honors it, so the
      # version lives in exactly one place.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"


      - uses: Swatinem/rust-cache@v2

      # Protected databases are local evidence and intentionally uncommitted.
      # CI validates the one authoritative manifest's schema; the shell lane
      # below exercises all verifier mismatch controls on disposable databases.
      - name: validate protected-evidence manifest
        run: python3 tools/evidence_artifacts.py validate

      - name: cargo check --workspace --locked
        run: cargo check --workspace --locked --all-targets

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      - name: verify persisted fingerprints on the golden fixture
        run: |
          fixture_dir="$(mktemp -d)"
          fixture_db="$fixture_dir/golden-fingerprint-fixture.db"
          cargo run --quiet -p intel-store --example fingerprint_fixture -- "$fixture_db"
          ./run verify-fingerprints "$fixture_db"

      # fmt/clippy are their own blocking job (`lint`) below.
      - name: emit CI-runner receipt
        if: always()
        run: |
          mkdir -p evidence/ci-runs
          checked_out_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          cat > "evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json" <<JSON
          {
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "job": "${{ github.job }}",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "event_sha": "${{ github.sha }}",
            "sha": "$checked_out_sha",
            "conclusion": "${{ job.status }}",
            "runner_os": "${{ runner.os }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "CI_RECEIPT_PATH=evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json" >> "$GITHUB_ENV"
      - name: attest CI-runner receipt
        id: attest
        if: always() && inputs.publish_evidence == true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.CI_RECEIPT_PATH }}
      - name: persist CI-runner attestation bundle
        if: always() && inputs.publish_evidence == true
        run: cp "${{ steps.attest.outputs.bundle-path }}" "$CI_RECEIPT_PATH.sigstore"
      - name: persist CI-runner receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ env.CI_RECEIPT_PATH }}
            ${{ env.CI_RECEIPT_PATH }}.sigstore
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Lint: clippy + rustfmt, blocking on every push and pull request.
  #
  # A known-and-accepted clippy divergence remains:
  # `clippy::unnecessary_map_or` is #![allow]'d in intel-compliance and
  # arxiv_oai, because its fix (`Option::is_none_or`) is Rust 1.82+ and would
  # raise the offline MSRV floor above the declared 1.78. That is a deliberate
  # trade, not debt.
  #
  # T6 verified both commands clean on the pinned 1.91.1 toolchain before
  # promoting this job from report-only to blocking.
  # ---------------------------------------------------------------------------
  lint:
    name: clippy + fmt (blocking)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.audit_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: emit CI-runner receipt
        if: always()
        run: |
          mkdir -p evidence/ci-runs
          checked_out_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          cat > "evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json" <<JSON
          {
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "job": "${{ github.job }}",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "event_sha": "${{ github.sha }}",
            "sha": "$checked_out_sha",
            "conclusion": "${{ job.status }}",
            "runner_os": "${{ runner.os }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "CI_RECEIPT_PATH=evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json" >> "$GITHUB_ENV"
      - name: attest CI-runner receipt
        id: attest
        if: always() && inputs.publish_evidence == true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.CI_RECEIPT_PATH }}
      - name: persist CI-runner attestation bundle
        if: always() && inputs.publish_evidence == true
        run: cp "${{ steps.attest.outputs.bundle-path }}" "$CI_RECEIPT_PATH.sigstore"
      - name: persist CI-runner receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ env.CI_RECEIPT_PATH }}
            ${{ env.CI_RECEIPT_PATH }}.sigstore
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The live path. This job is the whole reason this file exists: `--features
  # net` is not in the default build graph, so a plain `cargo check` compiles
  # none of it, which is how it stayed broken across multiple releases without
  # anyone noticing.
  #
  # It is a SEPARATE job, not a step in `core`, so that its failure is legible
  # at a glance rather than buried in a log — and so it can carry its own,
  # higher MSRV (>= 1.86: icu_* 2.2.0, via idna_adapter, declare that floor).
  # ---------------------------------------------------------------------------
  net:
    name: live-fetch path (--features net)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.audit_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2

      - name: cargo check -p cored --features net --locked
        run: cargo check -p cored --features net --locked --all-targets

      - name: cargo test -p intel-ingest --features net --locked
        run: cargo test -p intel-ingest --features net --locked

      - name: cargo test -p cored --features net --locked
        env:
          INTEL_CRAWLER_CONTACT: crawler-tests@unit.test
        run: cargo test -p cored --features net --locked
      - name: emit CI-runner receipt
        if: always()
        run: |
          mkdir -p evidence/ci-runs
          checked_out_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          cat > "evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json" <<JSON
          {
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "job": "${{ github.job }}",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "event_sha": "${{ github.sha }}",
            "sha": "$checked_out_sha",
            "conclusion": "${{ job.status }}",
            "runner_os": "${{ runner.os }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "CI_RECEIPT_PATH=evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json" >> "$GITHUB_ENV"
      - name: attest CI-runner receipt
        id: attest
        if: always() && inputs.publish_evidence == true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.CI_RECEIPT_PATH }}
      - name: persist CI-runner attestation bundle
        if: always() && inputs.publish_evidence == true
        run: cp "${{ steps.attest.outputs.bundle-path }}" "$CI_RECEIPT_PATH.sigstore"
      - name: persist CI-runner receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ env.CI_RECEIPT_PATH }}
            ${{ env.CI_RECEIPT_PATH }}.sigstore
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The MSRV floor for the OFFLINE build is **1.78**, and getting to that number
  # was the most instructive hour of this cycle.
  #
  #   An earlier release claimed "Rust 1.75 + --locked still builds the offline
  #   path." That was FALSE and had never been run; it also committed
  #   `Cargo.lock` at
  #   **format v4**, which cargo cannot even *parse* before 1.78. `cargo +1.75
  #   check --locked` died at the lockfile, long before it reached any
  #   dependency's MSRV.
  #
  #   The obvious fix — re-encode the lock as v3 — WORKS (1.75 builds, 75 tests
  #   green; verified). It is also NOT STABLE: cargo 1.91 rewrites the lock back
  #   to v4 the moment it has to modify it, so the v3 encoding is a hand-edit
  #   that the next dependency change silently undoes. A floor that holds only
  #   until someone touches the lock is not a floor. So we state the one that is
  #   actually true and actually sustainable: **1.78**.
  #
  # Two lessons, both kept on the record:
  #   1. The lockfile FORMAT is part of the MSRV surface, not just the
  #      dependency graph. Dependency MSRVs here still permit 1.75; the lock
  #      format does not.
  #   2. A claimed property that nothing executes is not a property. This is the
  #      THIRD time this project has been bitten by exactly that (--features net
  #      unbuilt for two cycles; robots policy never fetched; this).
  #
  # This job is also what stops a future dependency (say, a robots.txt crate
  # that drags in the icu_* chain — see STATE §6b) from silently raising the
  # floor to 1.86 while every other job stays green.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV floor (offline builds on 1.78)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.audit_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.78"
      - uses: Swatinem/rust-cache@v2

      # No -D warnings here: an older compiler lints differently, and we are
      # asserting that it *builds*, not that it is lint-clean on 1.78.
      - name: cargo check --workspace --locked (1.78)
        env:
          RUSTFLAGS: ""
        run: cargo check --workspace --locked

      - name: cargo test --workspace --locked (1.78)
        env:
          RUSTFLAGS: ""
        run: cargo test --workspace --locked
      - name: emit CI-runner receipt
        if: always()
        run: |
          mkdir -p evidence/ci-runs
          checked_out_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          cat > "evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json" <<JSON
          {
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "job": "${{ github.job }}",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "event_sha": "${{ github.sha }}",
            "sha": "$checked_out_sha",
            "conclusion": "${{ job.status }}",
            "runner_os": "${{ runner.os }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "CI_RECEIPT_PATH=evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json" >> "$GITHUB_ENV"
      - name: attest CI-runner receipt
        id: attest
        if: always() && inputs.publish_evidence == true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.CI_RECEIPT_PATH }}
      - name: persist CI-runner attestation bundle
        if: always() && inputs.publish_evidence == true
        run: cp "${{ steps.attest.outputs.bundle-path }}" "$CI_RECEIPT_PATH.sigstore"
      - name: persist CI-runner receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ env.CI_RECEIPT_PATH }}
            ${{ env.CI_RECEIPT_PATH }}.sigstore
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The shell. Free, and it holds the entitlement/licensing invariants that the
  # Rust tests deliberately do not (HC1/HC2 live on both sides of the seam).
  # ---------------------------------------------------------------------------
  shell:
    name: shell (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.audit_sha || github.sha }}
          # version-check compares the nearest release tag. A depth-1 checkout
          # ahead of that tag would reduce the check to an avoidable warning.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: release version consistency
        run: ./run version-check
      - name: active cycle and amendment consistency
        if: matrix.python-version == '3.11'
        # Hosted clones cannot resolve annotated refs that were intentionally
        # retained only in the operator repository. The strict local command
        # remains responsible for tag-object identity; this runner still checks
        # every release record, recorded commit, source literal, and amendment.
        run: ./run cycle-check --skip-local-tag-verification
      - name: checked-task evidence
        if: matrix.python-version == '3.11'
        run: ./run checklist-audit
      - name: registered static repository invariants
        if: matrix.python-version == '3.11'
        run: ./run invariant-scan
      - name: append-only progress record
        if: matrix.python-version == '3.11'
        run: ./run progress-check
      - name: byte-compile all Python at the 3.11 floor
        if: matrix.python-version == '3.11'
        run: find tools shell -type f -name '*.py' -print0 | xargs -0 python3.11 -m py_compile
      - name: assert ShellCheck is installed
        if: matrix.python-version == '3.11'
        run: |
          command -v shellcheck
          shellcheck --version
      - name: shellcheck run harness
        if: matrix.python-version == '3.11'
        run: shellcheck ./run
      - name: install
        run: pip install -c shell/constraints.txt -r shell/requirements.txt
      - name: verify pinned Python environment
        run: python3 tools/python_constraints.py shell/constraints.txt
      - name: evidence verifier controls
        run: PYTHONPATH=shell python3 -m pytest shell/tests/test_evidence_artifacts.py -q
      - name: re-derive pinned deferred evidence
        if: matrix.python-version == '3.11'
        run: |
          baseline="$(
            python3 tools/cycle_identity.py \
              historical-artifact deferred-audit-baseline
          )"
          python3 tools/evidence_artifacts.py validate
          python3 tools/audit_deferred.py \
            --rederive "$baseline"
      - name: pytest
        run: PYTHONPATH=shell python3 -m pytest shell/tests -q
      - name: emit CI-runner receipt
        if: always()
        run: |
          mkdir -p evidence/ci-runs
          checked_out_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          cat > "evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-py${{ matrix.python-version }}.json" <<JSON
          {
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "job": "${{ github.job }}",
            "matrix": "python=${{ matrix.python-version }}",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "event_sha": "${{ github.sha }}",
            "sha": "$checked_out_sha",
            "conclusion": "${{ job.status }}",
            "runner_os": "${{ runner.os }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "CI_RECEIPT_PATH=evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-py${{ matrix.python-version }}.json" >> "$GITHUB_ENV"
      - name: attest CI-runner receipt
        id: attest
        if: always() && inputs.publish_evidence == true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.CI_RECEIPT_PATH }}
      - name: persist CI-runner attestation bundle
        if: always() && inputs.publish_evidence == true
        run: cp "${{ steps.attest.outputs.bundle-path }}" "$CI_RECEIPT_PATH.sigstore"
      - name: persist CI-runner receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-py${{ matrix.python-version }}
          path: |
            ${{ env.CI_RECEIPT_PATH }}
            ${{ env.CI_RECEIPT_PATH }}.sigstore
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The cross-language regression anchor. Unit tests cannot stand in for this:
  # it starts the real Rust core, deterministic model double, and public Python
  # API against one disposable database, then asserts every documented corpus,
  # entitlement, licensing, retrieval, and citation value.
  # ---------------------------------------------------------------------------
  golden:
    name: golden E2E (blocking)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.audit_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: assert the golden end-to-end
        run: ./run golden
      - name: emit CI-runner receipt
        if: always()
        run: |
          mkdir -p evidence/ci-runs
          checked_out_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          cat > "evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json" <<JSON
          {
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "job": "${{ github.job }}",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "event_sha": "${{ github.sha }}",
            "sha": "$checked_out_sha",
            "conclusion": "${{ job.status }}",
            "runner_os": "${{ runner.os }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "CI_RECEIPT_PATH=evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json" >> "$GITHUB_ENV"
      - name: attest CI-runner receipt
        id: attest
        if: always() && inputs.publish_evidence == true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.CI_RECEIPT_PATH }}
      - name: persist CI-runner attestation bundle
        if: always() && inputs.publish_evidence == true
        run: cp "${{ steps.attest.outputs.bundle-path }}" "$CI_RECEIPT_PATH.sigstore"
      - name: persist CI-runner receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ env.CI_RECEIPT_PATH }}
            ${{ env.CI_RECEIPT_PATH }}.sigstore
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Drift report. Runs on a schedule, NEVER on a PR, and never commits anything.
  #
  # It exists because the failure mode we keep hitting is not "a dependency
  # broke" — it is "a dependency broke and we found out months later, from a
  # build error that pointed at the wrong thing." (`edition2024` surfaced as
  # `failed to download replaced source registry 'crates-io'`, which sent two
  # separate investigations looking in the registry instead of at MSRVs.)
  #
  # `continue-on-error` is deliberate: drift is information, not a failure. A
  # red X here would train us to ignore it.
  # ---------------------------------------------------------------------------
  drift:
    name: dependency drift (report only)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.audit_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"

      - name: what would cargo update do?
        run: |
          echo "## Dependency drift" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo update --dry-run --workspace 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The specific thing that bit us: a transitive dep quietly raising its
      # MSRV above our floor. Surface every declared rust-version so a bump is
      # visible in the diff of this report rather than in a broken build.
      - name: MSRV of the resolved graph
        run: |
          echo "## Declared MSRVs in the resolved graph" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo metadata --format-version 1 --locked \
            | python3 -c "import json,sys; [print(f\"{p['rust_version']:>8}  {p['name']} {p['version']}\") for p in sorted(json.load(sys.stdin)['packages'], key=lambda p: p.get('rust_version') or '') if p.get('rust_version')]" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: emit CI-runner receipt
        if: always()
        run: |
          mkdir -p evidence/ci-runs
          checked_out_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          cat > "evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json" <<JSON
          {
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "job": "${{ github.job }}",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "event_sha": "${{ github.sha }}",
            "sha": "$checked_out_sha",
            "conclusion": "${{ job.status }}",
            "runner_os": "${{ runner.os }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "CI_RECEIPT_PATH=evidence/ci-runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json" >> "$GITHUB_ENV"
      - name: attest CI-runner receipt
        id: attest
        if: always() && inputs.publish_evidence == true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.CI_RECEIPT_PATH }}
      - name: persist CI-runner attestation bundle
        if: always() && inputs.publish_evidence == true
        run: cp "${{ steps.attest.outputs.bundle-path }}" "$CI_RECEIPT_PATH.sigstore"
      - name: persist CI-runner receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ env.CI_RECEIPT_PATH }}
            ${{ env.CI_RECEIPT_PATH }}.sigstore
          if-no-files-found: error
